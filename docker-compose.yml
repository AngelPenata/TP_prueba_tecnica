services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dpdo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password12345"
      MSSQL_PID: Developer
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password12345' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Password12345' -Q 'SELECT 1' "]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
